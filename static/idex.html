<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Career Guide</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #123c69;
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #123c69;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d2d4f;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: #eef6ff;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎯 AI Career Guide</h1>

    <p>
        Discover a suitable career path based on your skills,
        interests and goals.
    </p>

    <label>Your Education</label>
    <input
        type="text"
        id="education"
        placeholder="Example: BCA"
    >

    <label>Your Skills</label>
    <input
        type="text"
        id="skills"
        placeholder="Example: Python, SQL, HTML"
    >

    <label>Your Interest</label>
    <input
        type="text"
        id="interest"
        placeholder="Example: Artificial Intelligence"
    >

    <label>Your Career Goal</label>
    <input
        type="text"
        id="goal"
        placeholder="Example: Software Developer"
    >

    <label>Preferred Language</label>

    <select id="language">
        <option value="English">English</option>
        <option value="Tamil">Tamil</option>
    </select>

    <button onclick="getRecommendation()">
        Get Career Recommendation
    </button>

    <div id="result">
        <h2>Career Recommendation</h2>
        <p id="recommendation"></p>
    </div>

</div>

<script>

function getRecommendation() {

    let education = document.getElementById("education").value;
    let skills = document.getElementById("skills").value;
    let interest = document.getElementById("interest").value;
    let goal = document.getElementById("goal").value;

    let result = document.getElementById("result");
    let recommendation = document.getElementById("recommendation");

    if (education === "" || skills === "" || interest === "" || goal === "") {

        alert("Please fill all the fields.");

        return;
    }

    recommendation.innerHTML =
        "Based on your information, we will recommend a suitable career path.";

    result.style.display = "block";
}

</script>

</body>
</html>
