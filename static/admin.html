<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Career Guide - Admin</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #123c69;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            padding: 20px;
            background: #eef6ff;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            color: #123c69;
        }

        .stat-title {
            margin-top: 8px;
            color: #555;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #123c69;
            color: white;
        }

        tr:hover {
            background: #f5f9ff;
        }

        .refresh-button {
            margin-bottom: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #123c69;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .refresh-button:hover {
            background: #0d2d4f;
        }

        .message {
            text-align: center;
            padding: 20px;
            color: #666;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>📊 AI Career Guide</h1>

    <p class="subtitle">
        Admin Dashboard — Student Career Assessments
    </p>


    <div class="stats">

        <div class="stat-card">

            <div
                class="stat-number"
                id="totalStudents"
            >
                0
            </div>

            <div class="stat-title">
                Total Assessments
            </div>

        </div>


        <div class="stat-card">

            <div
                class="stat-number"
                id="topCareer"
            >
                -
            </div>

            <div class="stat-title">
                Popular Career
            </div>

        </div>

    </div>


    <button
        class="refresh-button"
        onclick="loadStudents()"
    >
        🔄 Refresh Data
    </button>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Education</th>

                    <th>Skills</th>

                    <th>Interest</th>

                    <th>Goal</th>

                    <th>Career</th>

                    <th>Score</th>

                </tr>

            </thead>


            <tbody id="studentTable">

            </tbody>

        </table>

    </div>


    <div
        class="message"
        id="message"
    >
        Loading student data...
    </div>

</div>


<script>

async function loadStudents() {

    const table =
        document.getElementById("studentTable");

    const message =
        document.getElementById("message");


    table.innerHTML = "";

    message.innerText =
        "Loading student data...";


    try {

        const response =
            await fetch("/api/students");


        if (!response.ok) {

            throw new Error("Server error");

        }


        const data =
            await response.json();


        document.getElementById(
            "totalStudents"
        ).innerText =
            data.length;


        if (data.length === 0) {

            message.innerText =
                "No student assessments found.";

            document.getElementById(
                "topCareer"
            ).innerText = "-";

            return;

        }


        message.innerText = "";


        const careerCount = {};


        data.forEach(function(student) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${student.id}</td>

                <td>${student.name}</td>

                <td>${student.education}</td>

                <td>${student.skills}</td>

                <td>${student.interest}</td>

                <td>${student.goal}</td>

                <td>${student.career}</td>

                <td>${student.score}</td>

            `;


            table.appendChild(row);


            if (careerCount[student.career]) {

                careerCount[student.career]++;

            }

            else {

                careerCount[student.career] = 1;

            }

        });


        let popularCareer = "";

        let highestCount = 0;


        for (
            const career in careerCount
        ) {

            if (
                careerCount[career] > highestCount
            ) {

                highestCount =
                    careerCount[career];

                popularCareer =
                    career;

            }

        }


        document.getElementById(
            "topCareer"
        ).innerText =
            popularCareer;

    }


    catch (error) {

        console.error(error);

        message.innerText =
            "Unable to load student data.";

    }

}


loadStudents();

</script>

</body>

</html>
